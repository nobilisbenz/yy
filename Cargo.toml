[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nabi/brain-dock"

[workspace.dependencies]
# internal
brain-core = { path = "crates/brain-core" }
brain-proto = { path = "crates/brain-proto" }
brain-index = { path = "crates/brain-index" }
brain-engine = { path = "crates/brain-engine" }
brain-x11 = { path = "crates/brain-x11" }
brain-bench = { path = "crates/brain-bench" }

# The vault engine: schema, parser, section identity, and the shared graph.
# `yy` is a separate workspace inside the same repository, so this reaches up one level.
# PLAN.md §2.2 decision A — one parser, one `section_uid`, one graph.
yalive = { path = ".." }

# async / runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
# `sink` is what provides SinkExt and Stream::split; it is not reliably on by
# default once the feature graph is unified, so name it.
futures-util = { version = "0.3", features = ["sink"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# The benchmark question set is YAML per the plan; this is the same version `yalive`
# already uses for front matter, so there is one YAML stack in the tree rather than two.
serde_yaml = "0.9"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
uuid = { version = "1", features = ["v4", "serde"] }
etcetera = "0.11"
clap = { version = "4", features = ["derive", "env"] }

# indexing
# `globset` compiles the include/exclude patterns from config; `notify` plus the
# debouncer is what turns nvim's atomic-save rename pair into one event instead of a
# delete followed by a create (Stage 1 §1.5).
globset = "0.4"
notify = "8"
notify-debouncer-full = "0.6"

# inference
# `rustls-tls` rather than the default native-tls: llama-server is on localhost so TLS is
# not used at all, and pulling in openssl would add a system dependency for nothing.
# `stream` is what gives `bytes_stream()` for reading SSE.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# yy's own store: the answer cache and provenance rows. Separate from the vault index,
# which `yalive` owns (PLAN.md §2.2) — these are `yy`'s data and have no business in a
# vault's `.notes/`. Version pinned to match `yalive` so cargo unifies one SQLite build.
rusqlite = { version = "0.37", features = ["bundled"] }
blake3 = "1.8"

# ui
#
# iced 0.14 pins wgpu 27, winit 0.30, raw-window-handle 0.6. yGraphy must match that
# wgpu version when the graph panel lands (PLAN.md §7.2) — note that no glyphon release
# targets wgpu 27, which is why the panel renders labels as iced widgets instead.
#
# `wgpu`     — the iced_wgpu renderer, and what `widget::shader` needs.
# `advanced` — custom widgets and the shader widget's Program/Primitive traits.
# `tokio`    — makes iced's executor the same runtime brain-proto expects, so the daemon
#              connection can be an ordinary Subscription instead of a bridged thread.
iced = { version = "0.14", features = ["wgpu", "advanced", "tokio"] }

# x11
x11rb = { version = "0.14", features = ["randr"] }
raw-window-handle = "0.6"

# dev
tempfile = "3"

# wgpu and the text-shaping stack are unusably slow in an unoptimised debug build, and
# Stage 0 is nothing but iterating on UI feel. Build our own crates lightly and
# every dependency at full speed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

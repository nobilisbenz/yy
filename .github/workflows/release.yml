name: Release yy

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Linux release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clone yalive (path dependency at `..`)
        working-directory: ${{ github.workspace }}/..
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            https://github.com/nobilisbenz/yAlive.git yalive-stage
          rsync -a yalive-stage/ ./
          rm -rf yalive-stage

      - name: Clone yGraphy (path dependency of brain-dock)
        working-directory: ${{ github.workspace }}/..
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            https://github.com/nobilisbenz/yGraphy.git "$GITHUB_WORKSPACE/../yGraphy"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir release
          tar -C target/release -czf release/yy-linux-x86_64.tar.gz \
            brain-dock brainctl brain-daemon

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
